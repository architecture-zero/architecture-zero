name: CI

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI directly, not gitleaks-action: the action requires a
      # paid license for ORGANIZATION repos; the CLI scans the full history
      # for free either way.
      - name: Run gitleaks over the full history
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source /repo --no-banner --redact -v

  tests:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run the suite
        working-directory: backend
        run: python -m pytest tests -q

  image:
    name: docker image builds
    # Main-branch pushes only: proves the Dockerfile (including the baked
    # reranker layers) without spending build minutes on every PR round.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} ./backend
