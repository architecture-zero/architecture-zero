name: CI

on:
  push:
  pull_request:
  # The three scan jobs below answer "is anything this depends on known to be
  # broken TODAY", and that answer changes when a vulnerability database is
  # updated rather than when this tree is. On a diff-only trigger, a repository
  # nobody has pushed to is a repository nobody is told about - which is
  # exactly the state a template is meant to sit in between releases.
  #
  # Worth knowing before relying on it: GitHub disables a scheduled workflow
  # after 60 days with no repository activity, so the quiet stretch that makes
  # the schedule valuable is also what eventually switches it off. The Actions
  # tab says so, and re-enabling is one button.
  schedule:
    - cron: "17 9 * * *"   # off the top of the hour, where scheduled runs queue
  workflow_dispatch:       # and on demand, from the Actions tab

jobs:
  # Runner image pinned to ubuntu-26.04 on 2026-09-30, after the suite passed on
  # the new image. ubuntu-latest moves to 26.04 between 2026-10-19 and
  # 2026-11-19 (actions/runner-images#14748); pinning removes the weeks in
  # which runs land on either image.
  residue:
    name: private-residue guard
    runs-on: ubuntu-26.04
    # A tree only gains residue through a diff, so the daily run has nothing
    # to add here. Same reasoning for gitleaks and the frontend job below.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      # This template is derived from private deployments. Nothing from that
      # lineage - names, hosts, workspace paths - may appear in the tree. The
      # patterns live in .github/residue-denylist.txt (excluded from its own
      # scan); a hit prints the offending lines and fails the job. Added
      # 2026-08-27, the day a private system's name shipped in a test comment
      # HOURS after a hand scrub of exactly that class - hands lose this game,
      # so a machine plays it.
      #
      # The list here is deliberately SHORT: only terms this repo's own public
      # record already carries, because a public denylist that names things
      # not yet public would itself be the leak it guards against. A fuller
      # private-side list runs in the maintainer's port tooling before pushes.
      - name: Forbid private-infrastructure residue
        shell: bash
        run: |
          if git grep -nIiE -f .github/residue-denylist.txt -- . \
               ':!.github/residue-denylist.txt' ':!frontend/package-lock.json'; then
            echo "::error::private-infrastructure residue found (patterns: .github/residue-denylist.txt)"
            exit 1
          fi
          # The lockfile is scanned separately, with its integrity hashes
          # removed first. Those values are base64, so they contain arbitrary
          # letter runs and will eventually match a short pattern by chance -
          # one already does. Excluding the whole file instead would hide a
          # real leak (a private registry host in a `resolved` URL), so only
          # the hash lines are skipped, and only in this file.
          if [ -f frontend/package-lock.json ]; then
            if grep -vE '^[[:space:]]*"integrity":' frontend/package-lock.json \
                 | grep -nIiE -f .github/residue-denylist.txt; then
              echo "::error::private-infrastructure residue found in frontend/package-lock.json"
              exit 1
            fi
          fi
          echo "tree is clean of denylisted residue"

  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-26.04
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI directly, not gitleaks-action: the action requires a
      # paid license for ORGANIZATION repos; the CLI scans the full history
      # for free either way.
      - name: Run gitleaks over the full history
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source /repo --no-banner --redact -v

  # Dependency CVEs. The scan is only half of this job. A finding that cannot
  # be fixed still has to be answered, and the answer belongs somewhere a
  # deployer can read it rather than in the maintainer's head - so everything
  # ignored below says why, what the ignore rests on, and what retires it.
  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The audit resolves the pins under the Python on PATH, so it gets the
      # runtime image's 3.11 - not whatever the runner image ships (3.14 on
      # ubuntu-26.04, 3.12 before it), which a dependency's markers can read
      # differently.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          # requirements-dev.txt opens with `-r requirements.txt`, so this one
          # input covers the runtime pins too. Passing both files reports every
          # shared finding twice.
          inputs: backend/requirements-dev.txt
          #
          # ACCEPTED, permanently - chromadb 0.5.23, CVE-2026-45830 / -45831 /
          # -45833. No fix exists at any version: the affected range is 0.4.17
          # through 1.5.9 inclusive, which is every release including the
          # newest, so this cannot be upgraded away. All three describe the
          # chroma SERVER - its HTTP /api/v2/tenants routes, its authorization
          # provider, its tenant model. This app builds an embedded
          # chromadb.PersistentClient in-process: no HttpClient, no server, no
          # port, no tenants, and no authorization provider for an
          # "authenticated user" to be. That condition is pinned by
          # backend/tests/test_chroma_embedded_only.py rather than by this
          # comment, because a comment cannot enforce a condition, and it is
          # written up for operators in SECURITY.md under "Deploying this
          # safely". Re-triage the day that test fails.
          #
          # ACCEPTED - ecdsa 0.19.2, PYSEC-2026-1325 (CVE-2024-23342), the
          # Minerva timing attack on P-256. Transitive via python-jose; no
          # upstream fix exists or is planned. Not exercised here: every token
          # this code signs or verifies is HS256 (auth.py and jwt_auth.py both
          # pin ALGORITHM), so the ECDSA paths never run. Re-triage if an ES*
          # or RS* algorithm is ever adopted.
          #
          # DEFERRED, which is a different claim than accepted - starlette
          # 0.41.3, seven findings, transitive via fastapi 0.115.5. These have
          # fixes. Taking them needs starlette >= 1.3.1, which arrives through
          # a FastAPI major bump that changes the framework underneath a
          # template other people deploy, so it wants its own change and its
          # own acceptance run rather than a bump made to turn a scanner green.
          # Tracked in ROADMAP.md instead of being quietly parked here. What is
          # reachable meanwhile, stated rather than waved off: CVE-2025-54121
          # is a parsing slowdown on large multipart bodies, and this app takes
          # multipart at the admin KB upload route (authenticated, admin-only);
          # CVE-2026-48710 poisons request.url.path when the Host header goes
          # unvalidated, which matters to anyone putting path-based rules in a
          # proxy in front of this. The rest are denial-of-service shapes on
          # the same surface.
          #
          # ACCEPTED (triaged 2026-10-05) - CVE-2026-85394, python-jose through
          # 3.5.0: an HS256 token verified against a DER-encoded PUBLIC key when
          # the decode call leaves its algorithms open (an incomplete fix for
          # CVE-2024-33663). No fixed release exists. Not exercised here: every
          # jwt.decode pins exactly one algorithm - HS256 with the server's own
          # SECRET_KEY, or RS256 with a sign-in provider's fetched key - so a forged
          # HS256 token never meets a public key. Pinned by
          # backend/tests/test_jwt_algorithms_pinned.py rather than by this comment;
          # re-triage the day it fails, or when python-jose ships a fixed release.
          #
          # ACCEPTED (triaged 2026-10-21) - Pillow 12.3.0, every advisory OSV lists
          # for it as of 2026-10-21: the 28 CVE ids below, CVE-2026-112390 through
          # -112902 (decoder and transform faults - TIFF tiles and strips decoded
          # past their buffers or into uninitialized memory, a TIFF ColorMap
          # plane-size mismatch on encode, a zero-width image in _imagingmorph, a
          # GIF seek that keeps a rejected size, an EPS load that lets Ghostscript
          # render past the decompression-bomb limit, a PDF page tree or trailer
          # chain that recurses without bound, a double free in Image.transform
          # when an oversized output runs out of memory). The list is OSV's full
          # set, not the ids one run showed: the morning's runs reported eight,
          # the evening's sixteen more, and the advisory feed was still catching
          # up. Every one is fixed in Pillow 13.0.0, which cannot be installed:
          # fastembed (0.8.0 pinned here; 0.9.0 the same) requires pillow<13, and
          # pip refuses the pair. Not exercised here: no module of this app
          # imports Pillow - it is in the image only because fastembed imports it
          # for image-embedding models this app never loads - so no upload,
          # connector or crawl reaches a Pillow decoder. Pinned by
          # backend/tests/test_pillow_unreached.py rather than by this comment;
          # re-triage the day it fails, when a Pillow id outside this list appears
          # (a new advisory, or 13.0.0 itself in the affected range), or when
          # fastembed lets Pillow 13 in (its PR #830) - then bump fastembed and
          # drop these ids.
          # Re-triaged 2026-10-22, the day the template's CI found a Pillow id outside
          # the list: OSV's set for 12.3.0 grew from 28 to 39 - the eleven below are
          # the same class (decompression-bomb bypasses on a multi-frame seek and in
          # SpiderImagePlugin, a BMP RLE memory amplification and a TarIO spin, a PDF
          # page-tree DAG, a quadratic PNG eXIf parse, stale multi-frame storage, a
          # WMF/EMF over-read, a JPEG comment overflow, undefined native integer
          # behavior; and GHSA-78g4-xqwv-q3g8, the libopenjp2 bundled in every wheel
          # since 11.1.0), every one fixed only in 13.0.0; fastembed 0.9.0 (released
          # 2026-10-07, the newest) still requires pillow<13; test_pillow_unreached
          # still passes. The same re-open conditions stand.
          # Re-triaged 2026-10-23 on two more ids outside the list (OSV published
          # them 2026-10-19 and 2026-10-21): CVE-2026-112398, a heap overflow in
          # the FlashPix JPEG decoder, and CVE-2026-114501, stale heap memory in
          # the Arrow export when PILLOW_ALIGNMENT > 1 - the same class, fixed
          # only in 13.0.0; fastembed 0.9.0 is still the newest and still
          # requires pillow<13; test_pillow_unreached still passes. The same
          # re-open conditions stand.
          ignore-vulns: |
            CVE-2026-45830
            CVE-2026-45831
            CVE-2026-45833
            PYSEC-2026-1325
            CVE-2026-85394
            CVE-2025-54121
            CVE-2025-62727
            CVE-2026-48817
            CVE-2026-48818
            CVE-2026-54282
            CVE-2026-54283
            PYSEC-2026-161
            CVE-2026-112390
            CVE-2026-112391
            CVE-2026-112392
            CVE-2026-112393
            CVE-2026-112394
            CVE-2026-112395
            CVE-2026-112396
            CVE-2026-112397
            CVE-2026-112399
            CVE-2026-112400
            CVE-2026-112401
            CVE-2026-112402
            CVE-2026-112403
            CVE-2026-112404
            CVE-2026-112405
            CVE-2026-112406
            CVE-2026-112891
            CVE-2026-112892
            CVE-2026-112893
            CVE-2026-112894
            CVE-2026-112895
            CVE-2026-112896
            CVE-2026-112897
            CVE-2026-112898
            CVE-2026-112899
            CVE-2026-112900
            CVE-2026-112901
            CVE-2026-112902
            CVE-2026-96636
            CVE-2026-96637
            CVE-2026-96638
            CVE-2026-96639
            CVE-2026-96640
            CVE-2026-96641
            CVE-2026-96642
            CVE-2026-96643
            CVE-2026-96644
            CVE-2026-96778
            GHSA-78g4-xqwv-q3g8
            CVE-2026-112398
            CVE-2026-114501

  # SAST over this repository's own Python rather than its dependencies:
  # injection shapes, unsafe deserialization, weak crypto, credentials in
  # source.
  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install bandit
      # -ll reports medium severity and up, -ii medium confidence and up.
      # Without the confidence filter this flags every subprocess call and
      # every assert, and a job that is noisy by default is a job people learn
      # to skim past, which is the same outcome as not running it.
      - run: bandit -r backend/app -ll -ii

  # The overlapping layer: the same dependency set plus the lockfiles, the
  # container definitions and the compose files, scanned for vulnerabilities,
  # secrets and misconfiguration at once. The overlap with the two jobs above
  # is the point - it is what makes a gap in either of them visible.
  trivy:
    name: trivy (repository vuln, secret and misconfig scan)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          # The scanner itself, pinned: the action's default was 0.70.0. Bumped to
          # 0.74.0 on 2026-10-02 after a before/after on the committed tree of all
          # six repos with these flags - the same findings under both versions.
          version: v0.74.0
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          # A finding with no released fix is not something a deployer can act
          # on, and a build that is permanently red teaches people to stop
          # reading it. Unfixable findings are handled as written triage in the
          # pip-audit job above instead.
          ignore-unfixed: true

  tests:
    name: test suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # 3.11 matches the runtime image.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      # chromadb's native stack (hnswlib) can crash the INTERPRETER at
      # teardown on Linux - SIGSEGV on 3.12, SIGABRT on 3.11 - AFTER the
      # session completed and every test passed (a fully green summary,
      # then exit 139/134). The junit report is written at session end, so
      # it is the truth: a teardown crash is accepted ONLY when the report
      # exists and shows zero failures and zero errors. Any other exit code
      # fails, and a mid-run crash leaves no report, which also fails.
      - name: Run the suite
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest tests -q --junitxml=pytest-report.xml
          rc=$?
          set -e
          if [ $rc -ne 0 ] && [ $rc -ne 134 ] && [ $rc -ne 139 ]; then exit $rc; fi
          if [ $rc -ne 0 ]; then echo "interpreter teardown crash (exit $rc) after session end - verifying junit report"; fi
          python - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("pytest-report.xml").getroot()
          s = root if root.tag == "testsuite" else root.find("testsuite")
          tests = int(s.get("tests", 0)); fail = int(s.get("failures", 0)); err = int(s.get("errors", 0))
          print(f"junit verdict: {tests} tests, {fail} failures, {err} errors")
          sys.exit(0 if tests and not fail and not err else 1)
          EOF

  frontend:
    name: frontend (type-check, tests, build)
    runs-on: ubuntu-26.04
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      # Type-check first: it is the fastest of the three and catches the class
      # a contract change actually produces - a payload field that moved.
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  image:
    name: docker image builds
    # Main-branch pushes only: proves the Dockerfile (including the baked
    # reranker layers) without spending build minutes on every PR round.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} ./backend
      # The frontend image is the one operators actually run - the placeholder
      # bake and the entrypoint that replaces it only exist inside it, so a
      # passing `npm run build` does not prove this path.
      - name: Build frontend image
        run: docker build ./frontend
