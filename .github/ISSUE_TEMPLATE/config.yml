blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/architecture-zero/architecture-zero/security/advisories/new
    about: >-
      Please report privately rather than in a public issue, so a fix can land
      before the details are. The channel is enabled and monitored.
  - name: Question about running it
    url: https://github.com/orgs/architecture-zero/discussions
    about: >-
      Setup, configuration, and how-do-I questions go in Q&A. A running instance
      can also answer questions about itself, which is often faster.
