server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. A stock deployment of this template has nothing else in
    # front of it, so these belong here rather than in an edge proxy the
    # operator may never add. HSTS is deliberately absent: it is only correct
    # once TLS terminates in front of this container, and sending it over plain
    # HTTP on a first local run would pin localhost to https in the browser.
    #
    # THEY ARE REPEATED IN THE BLOCKS BELOW, AND THAT IS NOT REDUNDANT.
    # add_header is inherited by a nested block ONLY while that block declares
    # no add_header of its own; declaring one discards the whole inherited set.
    # Both cache-control blocks below declare one, and `/` reaches `= /index.html`
    # through try_files - so with these four declared only here, the JSON API
    # (which declares none, and inherits) carried them while the HTML document a
    # browser actually loads carried none at all. Exactly inverted, and the file
    # read as complete. Caught by the acceptance run, not by review.
    #
    # Adding a header here means adding it to every block below that sets one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Content-Security-Policy (2026-09-11). Why this strict set works for THIS
    # bundle: the build is one same-origin module script and one stylesheet,
    # no inline script or style, no fonts, no external host - and styles set
    # through React style props go through the CSSOM, which CSP does not
    # govern, so the syntax highlighter's inline colors survive style-src
    # 'self' with no 'unsafe-inline'. img-src 'self' is the browser-enforced
    # backstop for markdownSafety.tsx: a model-emitted remote image cannot
    # fetch even if that render guard regresses. frame-ancestors 'self'
    # matches the X-Frame-Options above. Two things are deliberately absent:
    # upgrade-insecure-requests (same reason HSTS is absent - a plain-HTTP
    # first run must keep working), and any off-origin connect-src. If you
    # set VITE_API_URL to an API on another origin while still serving the
    # UI from this container, add that origin to connect-src here, in all
    # three places. Proven on the public demo fork with a headless-Chrome run
    # (page load, a streamed chat answer, a rendered code block): zero
    # securitypolicyviolation events.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # The API, same-origin by default.
    #
    # This block is what lets the stock compose file work with no configuration:
    # the browser talks to one origin, so VITE_API_URL stays empty, CORS never
    # enters the picture, and the backend's server-side origin check is
    # satisfied by construction. An operator serving the API from somewhere else
    # sets VITE_API_URL to its absolute URL instead, and this block goes unused.
    #
    # The proxy directives themselves (and why proxy_pass goes through a
    # variable, why Host is $http_host, why buffering is off) live in
    # api-proxy.inc, shared with the upload block below.
    location /api/ {
        include /etc/nginx/conf.d/api-proxy.inc;
        # Request bodies on the JSON routes. nginx's default is 1m; this is
        # the parse-cost ceiling on what the backend's JSON parser is handed,
        # not the spend control - the chat route bounds its own input in
        # characters (CHAT_MAX_INPUT_CHARS, 200,000 by default, under 800 KB
        # even as four-byte UTF-8), and the backend carries the same ceiling
        # itself (MAX_JSON_BODY_BYTES, app/body_limit.py) for callers that
        # reach its port directly. Bounded here too so a 60 MB body dies at
        # the edge instead of in the backend's parser.
        client_max_body_size 2m;
    }

    # The one route that legitimately carries a large body. Before this
    # block existed the 1m default capped uploads through the shipped stack
    # far below the backend's own MAX_UPLOAD_MB - the 413 came from nginx as
    # an HTML page the client could not parse. 64m covers the shipped default
    # of 50 MB with headroom; raise the two together if MAX_UPLOAD_MB grows.
    # The backend reads this route's stream in chunks and stops AT its limit.
    location = /api/ingest/upload {
        include /etc/nginx/conf.d/api-proxy.inc;
        client_max_body_size 64m;
    }

    # SPA: unknown paths fall back to index.html (client-side routing). Scoped
    # AFTER the /api block above, because an unscoped fallback answers a failed
    # API call with index.html and HTTP 200 - the client then reports a JSON
    # parse error and the operator goes looking in the wrong place entirely.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed asset bundle; never cache the HTML shell.
    # Both blocks re-declare the security headers above - see the note there.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
}
