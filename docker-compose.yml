services:
  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: az_backend
    # Secrets and per-instance config live in .env on the HOST, never in this
    # file or the repo. Optional so a fresh clone starts with pure defaults;
    # copy .env.example to .env before real use (JWT_SECRET_KEY especially -
    # auth fails closed on the placeholder value).
    env_file:
      - path: .env
        required: false
    environment:
      KNOWLEDGE_DIR: /knowledge
      DOCS_DIR: /app/docs
      EVAL_SEED_PATH: /app/eval-questions.json
    # Loopback only (2026-10-01). The frontend's nginx reaches this service over
    # the compose network (frontend/api-proxy.inc -> backend:8000) for /api/ and
    # /metrics, so nothing in the stack needs the host port; it stays for your
    # own curl on this machine (the runbook's health check and first-run setup).
    # Published on every interface it let anyone who could reach the box skip
    # the proxy, and the backend's server bounded no header until the same day
    # (backend/Dockerfile). To reach the API from elsewhere, go through the
    # frontend's port or a proxy of your own in front of it.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The one persistent volume: SQLite DBs, the chroma index, ingest state,
      # backups. Everything else is read-only views of the repo.
      - ./backend/data:/app/data
      # The shipped corpus: help docs + demo company KB. The file watcher
      # live-ingests edits; the startup sync catches offline changes.
      - ./knowledge:/knowledge:ro
      # Operator docs (the runbook) ingest as docs/ sources - the assistant
      # can answer questions about running itself.
      - ./docs:/app/docs:ro
      # The eval seed also ships inside the image; this ro mount lets an
      # edited seed land with a restart instead of a rebuild.
      - ./backend/eval-questions.json:/app/eval-questions.json:ro
      # The extractor service's socket: every PDF and Word file is parsed
      # there, never in this container.
      - extractor_socket:/run/extractor
    depends_on:
      - extractor
    extra_hosts:
      # Lets OLLAMA_BASE / EMBED_BASE reach an Ollama server on the host with
      # the default http://host.docker.internal:11434 on Linux too.
      - "host.docker.internal:host-gateway"
    # Uvicorn's graceful shutdown drains, and the shutdown hook flushes
    # chroma's un-flushed HNSW tail. Compose's default 10s grace kills
    # through both - that is the vector-loss class. Keep this at 45s.
    stop_grace_period: 45s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: az_frontend
    # VITE_* values are baked as placeholders at build time and replaced from
    # this env at container start, so one built image serves every operator.
    env_file:
      - path: .env
        required: false
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # Nothing to configure for the API: nginx proxies /api to the backend
    # service on this network, so the browser sees ONE origin. That is why
    # VITE_API_URL is empty by default and why CORS does not come into it.
    # Set VITE_API_URL only when the API is served from somewhere else, and
    # then set CORS_ORIGIN to this frontend's origin to match.
    restart: unless-stopped

  # The file reader's locked box: every PDF and Word file is parsed here,
  # never in the backend (extractor/server.py). Each setting below is one
  # lock, and extractor/check_locks.py proves them all from inside the
  # running container - run it after any change here:
  #   docker compose exec extractor python -I check_locks.py
  # A parser bug in a hostile file then costs one child process in an empty
  # box: nothing here to steal, nowhere to send it, nothing to change.
  extractor:
    build:
      context: ./extractor
    container_name: az_extractor
    # No network at all; the backend reaches it through the socket folder.
    network_mode: none
    # No env_file: it holds no secret because it is given none. No mount but
    # the socket folder: none of the instance's files or data.
    volumes:
      - extractor_socket:/run/extractor
    read_only: true
    tmpfs:
      - /tmp:size=16m
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The whole box. It parses one file at a time, each in a child process
    # capped at 512 MB and a clock of 20 s that grows with the file's size to
    # 2 minutes (extractor/server.py). A full CPU while it reads, so an
    # honest long document finishes inside its clock.
    mem_limit: 640m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-I", "-c", "import socket; s = socket.socket(socket.AF_UNIX); s.connect('/run/extractor/extractor.sock')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  extractor_socket:
